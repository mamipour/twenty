name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 6am UTC
  workflow_dispatch:        # Also triggerable manually from GitHub Actions tab

jobs:
  sync:
    name: Merge upstream/main into fork
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/twentyhq/twenty.git

      - name: Fetch upstream
        run: git fetch upstream main --tags

      - name: Merge upstream/main
        id: merge
        run: |
          git merge upstream/main --no-edit --allow-unrelated-histories 2>&1
          echo "merged=true" >> $GITHUB_OUTPUT

      - name: Push to fork
        run: git push origin main

      - name: Notify on conflict
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          echo "::error::Merge conflict detected with upstream/main."
          echo "::error::Resolve manually: git fetch upstream && git merge upstream/main"
